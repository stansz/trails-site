<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OGS Trails — Hiking Trails Across Canada</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="icon" href="https://ogsapps.cc/logo.jpg">
<style>
  :root {
    --bg: #f8fafc; --surface: #ffffff; --surface2: #f1f5f9; --border: #e2e8f0;
    --text: #1e293b; --text2: #64748b; --accent: #22c55e;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: var(--font); background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; }
  .header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; background: var(--surface); border-bottom: 1px solid var(--border); z-index: 1000; flex-shrink: 0; }
  .header h1 { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .header h1 span { color: var(--accent); }
  .header-links { display: flex; gap: 12px; align-items: center; }
  .header-links a { color: var(--text2); text-decoration: none; font-size: 13px; }
  .header-links a:hover { color: var(--text); }
  #map { flex: 1; z-index: 1; }
  .panel { position: absolute; top: 52px; right: 12px; z-index: 999; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 260px; max-height: calc(100vh - 72px); overflow-y: auto; box-shadow: 0 8px 32px rgba(0,0,0,0.35); }
  .panel-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .panel-header h2 { font-size: 14px; font-weight: 600; }
  .panel-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 18px; padding: 0 4px; }
  .panel-body { padding: 12px 14px; }
  .legend-item { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 13px; cursor: pointer; border-radius: 4px; }
  .legend-item:hover { background: var(--surface2); }
  .legend-swatch { width: 24px; height: 4px; border-radius: 2px; flex-shrink: 0; }
  .legend-swatch.thick { height: 7px; }
  .legend-label { flex: 1; }
  .legend-count { color: var(--text2); font-size: 11px; }
  .legend-item.disabled { opacity: 0.4; }
  .legend-item.disabled .legend-swatch { background: var(--text2) !important; }
  .legend-section { font-size: 11px; color: var(--text2); margin: 8px 0 4px 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .controls { padding: 10px 14px; border-top: 1px solid var(--border); }
  .control-group { margin-bottom: 8px; }
  .control-group label { display: block; font-size: 11px; color: var(--text2); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  .control-group select { width: 100%; padding: 6px 8px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-size: 13px; }
  .btn { width: 100%; padding: 8px; background: var(--surface2); color: var(--text); border: none; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; margin-top: 8px; }
  .btn:hover { filter: brightness(0.95); }
  .stats-bar { padding: 6px 14px; background: var(--surface); border-top: 1px solid var(--border); display: flex; gap: 16px; font-size: 12px; color: var(--text2); z-index: 1000; flex-shrink: 0; }
  .stats-bar strong { color: var(--accent); }
  .loading { position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 999; background: var(--surface); border: 1px solid var(--border); padding: 6px 16px; border-radius: 20px; font-size: 13px; color: var(--text2); box-shadow: 0 4px 16px rgba(0,0,0,0.2); }
  .loading.hidden { display: none; }
  .leaflet-popup-content-wrapper { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 8px; }
  .leaflet-popup-content { margin: 10px 14px; font-size: 13px; line-height: 1.5; }
  .popup-name { font-weight: 600; font-size: 14px; }
  .popup-meta { color: var(--text2); margin-top: 2px; }
  .popup-diff { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; color: #fff; margin-top: 4px; }
  .popup-diff.b-blue { background: #3b82f6; }
  .popup-diff.b-green { background: #22c55e; }
  .popup-diff.b-yellow { background: #a16207; }
  .popup-diff.b-orange { background: #ea580c; }
  .popup-diff.b-red { background: #dc2626; }
  .popup-diff.b-purple { background: #9333ea; }
  .popup-diff.b-darkpurple { background: #581c87; }
  @media (max-width: 640px) {
    .panel { width: calc(100% - 24px); right: 12px; left: 12px; }
    .header h1 { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <h1>🥾 <span>OGS</span> Trails</h1>
  <div class="header-links">
    <a href="https://ogsapps.cc">Portal</a>
    <a href="https://bike.ogsapps.cc">Bike</a>
    <a href="https://sea.ogsapps.cc">Sea</a>
    <button onclick="togglePanel()" style="background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px">⚙️</button>
  </div>
</div>

<div id="map"></div>
<div class="loading hidden" id="loading">Loading trails...</div>

<div class="panel" id="panel">
  <div class="panel-header"><h2>Trail Layers</h2><button class="panel-close" onclick="togglePanel()">✕</button></div>
  <div class="panel-body"><div id="legend"></div></div>
  <div class="controls">
    <div class="control-group">
      <label>Province</label>
      <select id="province-filter" onchange="reloadData()">
        <option value="">All Canada</option>
        <option value="BC">British Columbia</option>
        <option value="AB">Alberta</option>
        <option value="ON">Ontario</option>
        <option value="QC">Quebec</option>
        <option value="NS">Nova Scotia</option>
      </select>
    </div>
    <button class="btn" onclick="resetView()">Reset View</button>
  </div>
</div>

<div class="stats-bar">
  <span>Trails: <strong id="stat-named">—</strong></span>
  <span>Paths: <strong id="stat-unnamed">—</strong></span>
  <span>Total: <strong id="stat-km">—</strong> km</span>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
var API = 'https://maps.ogsapps.cc/api';
var PROVINCE_BOUNDS = {
  BC: [48,60,-139.5,-114], AB: [49,60,-120,-110], ON: [42,57,-95.5,-74],
  QC: [45,62.5,-79.5,-57], NS: [43.5,47.5,-66.5,-59.5]
};

var map = L.map('map', { zoomControl: true }).setView([53, -125], 6);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://osm.org/copyright">OSM</a>',
  maxZoom: 18
}).addTo(map);

var namedLayer = L.layerGroup().addTo(map);
var unnamedLayer = L.layerGroup().addTo(map);
var loading = false;
var unnamedEnabled = true;
var allNamedLines = []; // keep original line data for toggle rebuilds

// Difficulty state — each key tracks enabled/disabled
var diffState = {};
var SAC_STYLES = [
  { key: 'strolling',                 color: '#3b82f6', label: 'T1 · Strolling', cls: 'b-blue', count: 0 },
  { key: 'hiking',                    color: '#22c55e', label: 'T2 · Hiking', cls: 'b-green', count: 0 },
  { key: 'mountain_hiking',           color: '#eab308', label: 'T3 · Mountain Hiking', cls: 'b-yellow', count: 0 },
  { key: 'demanding_mountain_hiking', color: '#f97316', label: 'T4 · Demanding', cls: 'b-orange', count: 0 },
  { key: 'alpine_hiking',             color: '#ef4444', label: 'T5 · Alpine Hiking', cls: 'b-red', count: 0 },
  { key: 'demanding_alpine_hiking',   color: '#7c3aed', label: 'T6 · Demanding Alpine', cls: 'b-purple', count: 0 },
  { key: 'difficult_alpine_hiking',   color: '#4c1d95', label: 'T6+ · Difficult Alpine', cls: 'b-darkpurple', count: 0 }
];
var SAC_MAP = {};
SAC_STYLES.forEach(function(s) { SAC_MAP[s.key] = s; });

// Default trail style for named trails without SAC scale
var DEFAULT_NAMED = { color: '#06b6d4', label: 'Unrated', cls: 'b-cyan' };

function getSAC(seg) {
  if (!seg.sac_scale) return null;
  var parts = seg.sac_scale.split(';');
  for (var i = 0; i < parts.length; i++) {
    var p = parts[i].trim();
    if (SAC_MAP[p]) return SAC_MAP[p];
  }
  return null;
}

var ALL_KEYS = SAC_STYLES.map(function(s) { return s.key; }).concat(['_no_sac_']);

function buildLegend() {
  diffState = {};
  var html = '';
  html += '<div class="legend-section">Difficulty</div>';
  ALL_KEYS.forEach(function(key) {
    diffState[key] = true;
    var style = SAC_MAP[key] || { color: '#06b6d4', label: 'Unrated' };
    html += '<div class="legend-item" onclick="toggleDifficulty(\'' + key + '\')" id="leg-diff-' + key + '">';
    html += '<div class="legend-swatch thick" style="background:' + style.color + '"></div>';
    html += '<span class="legend-label">' + style.label + '</span>';
    html += '<span class="legend-count" id="cnt-diff-' + key + '">0</span>';
    html += '</div>';
  });
  html += '<div class="legend-section" style="margin-top:12px">Layers</div>';
  html += '<div class="legend-item" onclick="toggleUnnamed()" id="leg-unnamed">';
  html += '<div class="legend-swatch" style="background:#94a3b8"></div>';
  html += '<span class="legend-label">All Paths</span>';
  html += '<span class="legend-count" id="cnt-unnamed">0</span></div>';
  document.getElementById('legend').innerHTML = html;
}

window.toggleDifficulty = function(key) {
  diffState[key] = !diffState[key];
  var el = document.getElementById('leg-diff-' + key);
  if (el) el.className = 'legend-item' + (diffState[key] ? '' : ' disabled');
  refreshLayerVisibility();
};

window.toggleUnnamed = function() {
  unnamedEnabled = !unnamedEnabled;
  var el = document.getElementById('leg-unnamed');
  if (el) el.className = 'legend-item' + (unnamedEnabled ? '' : ' disabled');
  if (unnamedEnabled) { map.addLayer(unnamedLayer); } else { map.removeLayer(unnamedLayer); }
};

window.refreshLayerVisibility = function() {
  namedLayer.clearLayers();
  allNamedLines.forEach(function(item) {
    var visible = diffState[item.sacKey] !== false;
    if (visible) namedLayer.addLayer(item.line);
  });
};

async function loadData() {
  if (loading) return;
  var bounds = map.getBounds();
  var sw = bounds.getSouthWest(), ne = bounds.getNorthEast();
  var prov = document.getElementById('province-filter').value;
  var minlat = sw.lat, maxlat = ne.lat, minlon = sw.lng, maxlon = ne.lng;
  if (prov && PROVINCE_BOUNDS[prov]) {
    minlat = Math.max(sw.lat, PROVINCE_BOUNDS[prov][0]);
    maxlat = Math.min(ne.lat, PROVINCE_BOUNDS[prov][1]);
    minlon = Math.max(sw.lng, PROVINCE_BOUNDS[prov][2]);
    maxlon = Math.min(ne.lng, PROVINCE_BOUNDS[prov][3]);
  }

  loading = true;
  document.getElementById('loading').classList.remove('hidden');

  try {
    var url = API + '/trails/segments?minlat=' + minlat.toFixed(5) + '&maxlat=' + maxlat.toFixed(5) + '&minlon=' + minlon.toFixed(5) + '&maxlon=' + maxlon.toFixed(5) + '&limit=2000';
    var res = await fetch(url);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var segments = await res.json();
    renderSegments(segments);
  } catch (e) {
    console.error(e);
  } finally {
    loading = false;
    document.getElementById('loading').classList.add('hidden');
  }
}

function renderSegments(segments) {
  namedLayer.clearLayers();
  unnamedLayer.clearLayers();
  allNamedLines = [];
  var namedCount = 0, unnamedCount = 0, totalKm = 0;
  var diffCounts = {};
  ALL_KEYS.forEach(function(k) { diffCounts[k] = 0; });

  segments.forEach(function(s) {
    var coords = [];
    if (s.geometry) {
      try {
        var parsed = typeof s.geometry === 'string' ? JSON.parse(s.geometry) : s.geometry;
        if (Array.isArray(parsed) && parsed.length >= 2) coords = parsed;
      } catch (e) {}
    }
    if (coords.length < 2) return;
    var latlngs = coords;
    totalKm += s.length_km || 0;

    if (s.name && s.name.trim()) {
      namedCount++;
      var sac = getSAC(s);
      var style = sac || DEFAULT_NAMED;
      var color = style.color;
      if (sac) diffCounts[sac.key] = (diffCounts[sac.key] || 0) + 1;
      else diffCounts['_no_sac_'] = (diffCounts['_no_sac_'] || 0) + 1;

      var line = L.polyline(latlngs, { color: color, weight: 3, opacity: 0.8 });
      var sacKey = sac ? sac.key : '_no_sac_';
      allNamedLines.push({ line: line, sacKey: sacKey });

      var popupHtml = '<div class="popup-name">' + esc(s.name) + '</div>';
      popupHtml += '<div class="popup-meta">' + esc(s.trail_type || '') + (s.length_km ? ' · ' + s.length_km.toFixed(2) + ' km' : '') + '</div>';
      if (sac) {
        popupHtml += '<div class="popup-diff ' + sac.cls + '">' + esc(sac.label) + '</div>';
      }
      line.bindPopup(popupHtml);
      line.on('mouseover', function() { line.setStyle({ weight: 5, opacity: 1 }); });
      line.on('mouseout', function() { line.setStyle({ weight: 3, opacity: 0.8 }); });
      namedLayer.addLayer(line);
    } else {
      unnamedCount++;
      unnamedLayer.addLayer(L.polyline(latlngs, { color: '#64748b', weight: 1.2, opacity: 0.45 }));
    }
  });

  document.getElementById('stat-named').textContent = namedCount;
  document.getElementById('stat-unnamed').textContent = unnamedCount;
  document.getElementById('stat-km').textContent = totalKm.toFixed(1);
  document.getElementById('cnt-unnamed').textContent = unnamedCount;

  ALL_KEYS.forEach(function(key) {
    var cnt = diffCounts[key] || 0;
    var el = document.getElementById('cnt-diff-' + key);
    if (el) el.textContent = cnt;
  });

  refreshLayerVisibility();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function reloadData() { loadData(); }
function resetView() {
  map.setView([53, -125], 6);
  document.getElementById('province-filter').value = '';
  loadData();
}
function togglePanel() {
  var p = document.getElementById('panel');
  p.style.display = p.style.display === 'none' ? '' : 'none';
}

var moveTimer;
map.on('moveend', function() {
  clearTimeout(moveTimer);
  moveTimer = setTimeout(loadData, 300);
});
window.addEventListener('resize', function() {
  map.invalidateSize();
  clearTimeout(moveTimer);
  moveTimer = setTimeout(loadData, 300);
});

buildLegend();
loadData();
})();
</script>
</body>
</html>
